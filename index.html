<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
    }

    .image-wrap {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
    }

    .image-wrap img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* 가장자리는 흐리고, 화면 중앙으로 갈수록 원본이 드러납니다. */
    .image-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url("original.png") center / contain no-repeat;
      filter: blur(12px);
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse 48% 52% at center, transparent 28%, #000 76%);
      mask-image: radial-gradient(ellipse 48% 52% at center, transparent 28%, #000 76%);
    }
  </style>
</head>
<body>
  <div class="image-wrap">
    <img src="original.png" alt="이미지">
  </div>
</body>
</html>
